      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: semantic communications
          keyword_cn: 语义通信
          query: semantic-aware communication systems and techniques
        - keyword: task-oriented semantic communication
          keyword_cn: 面向任务的语义通信
          query: task-oriented semantic communication for efficient wireless systems
        - keyword: semantic communication networks
          keyword_cn: 语义通信网络
          query: semantic communication in next-generation wireless networks
        - keyword: semantic communication resource allocation
          keyword_cn: 语义通信资源分配
          query: resource allocation and optimization for semantic communication
        - keyword: semantic communication performance analysis
          keyword_cn: 语义通信性能分析
          query: performance analysis and theoretical limits of semantic communication
        - keyword: deep learning semantic communication
          keyword_cn: 深度学习语义通信
          query: deep learning methods for semantic communication systems
      intent_queries:
        - query: Find recent high quality journal papers on semantic communications in wireless and next generation networks.
          query_cn: 查找无线与下一代网络中语义通信方向的最新高质量期刊论文。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-10-22T08:16:31.570Z'
